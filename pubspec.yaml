publish_to: none

name: papaya
version: 1.0.0+1

environment:
  sdk: '>=2.18.0 <3.0.0'
  flutter: '>=3.3.0 <4.0.0'

isar_version: &isar_version ^3.0.6-dev.0
riverpod_version: &riverpod_version ^2.1.1
dependencies:
  animated_toggle_switch: ^0.5.2
  auto_size_text: ^3.0.0
  cached_network_image: ^3.2.3
  catcher: ^0.7.0
  clipboard: ^0.1.3
  collection: ^1.17.0
  dio: ^4.0.6
  expandable_page_view: ^1.0.17
  flutter:
    sdk: flutter
  flutter_appauth: ^4.2.1
  flutter_hooks: ^0.18.5+1
  flutter_keyboard_visibility: ^5.4.0
  flutter_map: ^3.0.0
  flutter_multi_formatter: ^2.9.11
  flutter_native_splash: ^2.2.16
  flutter_riverpod: *riverpod_version
  flutter_stripe: ^7.0.0
  geocoding: ^2.0.5
  geolocator: ^9.0.2
  hooks_riverpod: *riverpod_version
  internet_connection_checker: ^1.0.0+1
  intl: ^0.18.0
  isar: *isar_version
  isar_flutter_libs: *isar_version
  json_converters_lite: ^1.0.2+1
  latlong2: ^0.8.1
  logging: ^1.1.0
  meta: ^1.9.0
  modal_bottom_sheet: ^3.0.0-pre
  ntp: ^2.0.0
  page_transition: ^2.0.9
  path_provider: ^2.0.11
  riverpod: *riverpod_version
  smooth_page_indicator: ^1.0.0+2
  styled_text: ^6.0.0
  url_launcher: ^6.1.7
  us_states: ^1.2.0

dev_dependencies:
  build_runner: ^2.3.2
  flutter_launcher_icons: ^0.11.0
  generators:
    path: ../generators
  isar_generator: *isar_version

dependency_overrides:
  collection: ^1.17.0
  ffi: ^2.0.1
  intl: ^0.18.0
  meta: ^1.9.0

flutter:
  assets:
    - source/assets/
    - source/assets/onboarding/

  fonts:
    - family: Icons
      fonts:
        - asset: source/icons.ttf

    - family: Bright
      fonts:
        - asset: source/fonts/Bright.ttf
          weight: 400

    - family: Quicksand
      fonts:
        - asset: source/fonts/Quicksand-Bold.ttf
          weight: 700
        - asset: source/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: source/fonts/Quicksand-Regular.ttf
          weight: 400


flutter_icons:
  android: launcher_icons
  ios: true
  remove_alpha_ios: true
  image_path: source/icon.png

flutter_native_splash:
  color: '#ffffff'
  image: source/icon.png
