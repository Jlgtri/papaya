
alert:
  exit:
    title: Are you sure you want to exit?
    approve: Yes, have a good day
    deny: No, I want to stay
  location_denied:
    title: Permission denied
    body: You denied location permission multiple times.
      Now you need to provide this permission in the app settings.
    approve: Open Settings
    deny: Cancel
  location_disabled:
    title: Location Services Disabled
    body: The location services on your device are disabled.
      Enable them in the settings.
    approve: Open Settings
    deny: Cancel
  location_invalid:
    title: Location Invalid
    body: Could not use this location for an address.
      Please try selecting the other one.
    approve: Okay
  cart_clear:
    title: Remove all items
    body: Are you sure you want to delete all items from the cart?
    approve: Confirm
    deny: Cancel
  store_added:
    title: Store already added
    body: You can't add products from multiple stores at the moment.\nClear your cart and try again.
    approve: Clear cart
    deny: I understood
  store_information_invalid:
    title: Error
    body: Store information can not be loaded. Please try again later.
    approve: I understood

