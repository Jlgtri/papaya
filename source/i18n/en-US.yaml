
alert:
  exit:
    title: Are you sure you want to exit?
    approve: Yes, have a good day
    deny: No, I want to stay
  location_denied:
    title: Permission denied
    body: You denied location permission multiple times.
      Now you need to provide this permission in the app settings.
    approve: Open Settings
    deny: Cancel
  location_disabled:
    title: Location Services Disabled
    body: The location services on your device are disabled.
      Enable them in the settings.
    approve: Open Settings
    deny: Cancel
  location_invalid:
    title: Location Invalid
    body: Could not use this location for an address.
      Please try selecting the other one.
    approve: Okay
  cart_clear:
    title: Remove all items
    body: Are you sure you want to delete all items from the cart?
    approve: Confirm
    deny: Cancel
  store_added:
    title: Start a new order?
    body(final String store):
      Hey, you still have items in your cart from <bold>$store</bold>.\n
      Do you want to start a new order or return to your previous one?
    approve: Start New Order
    deny(final String store): Return to $store
  store_information_invalid:
    title: Error
    body: Store information can not be loaded. Please try again later.
    approve: I understood
  profile_edit_error:
    title: Error
    body: There was an error while trying to edit the profile. Please try again later.
    approve: Okay, thanks
  note_clear:
    title: Warning
    body: Are you sure you want to remove your note?
    approve: Yes, please
    deny: No, leave it
  address_remove:
    title: Warning
    body: Are you sure you want to remove this address?
    approve: Yes, please
    deny: No, leave it
  address_error:
    title: Error
    body: There was an error while trying to modify the address. Please try again later.
    approve: Okay, thanks

